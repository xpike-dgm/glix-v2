services:
  glix:
    image: glix-v2:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      ALLOWED_ORIGINS: ${GLIX_ALLOWED_ORIGINS}
      # SIGTERM sonrası maçların bitmesi için en çok bekleme (10 dk); stop_grace_period bundan uzun olmalı.
      DRAIN_TIMEOUT_MS: "600000"
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 11m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
