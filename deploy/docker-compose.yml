services:
  glix:
    image: glix-v2:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "127.0.0.1:3900:3900"
    environment:
      ALLOWED_ORIGINS: ${GLIX_ALLOWED_ORIGINS}
      # SIGTERM sonrası maçların bitmesi için en çok bekleme (10 dk); stop_grace_period bundan uzun olmalı.
      DRAIN_TIMEOUT_MS: "600000"
      # Caddy arkasında: X-Forwarded-For son girdisi gerçek istemci IP'sidir (oran sınırları için).
      TRUST_PROXY: "1"
      # Anonim istatistik ve geri bildirim (SQLite); 90 gün saklanır.
      STATS_DB: /data/glix.db
      # Web bildirimleri (boşsa kapalı). Anahtarlar: node scripts/vapid-keys.mjs
      GLIX_VAPID_PUBLIC: ${GLIX_VAPID_PUBLIC:-}
      GLIX_VAPID_PRIVATE: ${GLIX_VAPID_PRIVATE:-}
      GLIX_VAPID_SUBJECT: ${GLIX_VAPID_SUBJECT:-}
      # Google ile giriş (boşsa kapalı, düğme gizlenir). Yönlendirme: ${GLIX_PUBLIC_URL}/api/auth/google/callback
      GLIX_GOOGLE_CLIENT_ID: ${GLIX_GOOGLE_CLIENT_ID:-}
      GLIX_GOOGLE_CLIENT_SECRET: ${GLIX_GOOGLE_CLIENT_SECRET:-}
      GLIX_PUBLIC_URL: ${GLIX_PUBLIC_URL:-}
      # E-posta: doğrulama ve şifre sıfırlama (Resend; boşsa kapalı, sıfırlama gizlenir). Bağlantılar GLIX_PUBLIC_URL ile kurulur.
      GLIX_RESEND_API_KEY: ${GLIX_RESEND_API_KEY:-}
      GLIX_MAIL_FROM: ${GLIX_MAIL_FROM:-}
      # Yönetici paneli (/admin): virgülle ayrılmış hesap kimlikleri. Boşsa panel kapalı (404). Giriş kodu e-postayla gelir (Resend gerekir).
      GLIX_ADMIN_ACCOUNT_IDS: ${GLIX_ADMIN_ACCOUNT_IDS:-}
    volumes:
      - glix-data:/data
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 11m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  glix-data:
