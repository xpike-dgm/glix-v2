# Üretim Merkezi. Oyundan ayrı kap, aynı Docker ağı (oyun sunucusuna http://glix-glix-1:3900 ile iç ağdan gider;
# oyun alanına (test2) ortak glix-oyun-alani ağından http://glix-test2-glix-1:3900 ile).
# Çalıştırma (kökten): docker compose --env-file /srv/glix/shared/.env -f deploy/uretim/docker-compose.yml -p uretim up -d --build
# `--env-file` yalnız aşağıdaki ${...} değerlerini doldurur; dosyanın tamamı kaba aktarılmaz.
services:
  uretim:
    image: glix-uretim:latest
    build:
      context: ../..
      dockerfile: deploy/uretim/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "127.0.0.1:3910:3910"
    environment:
      URETIM_PUBLIC_URL: ${URETIM_PUBLIC_URL:-https://uretim.dgmcraft.online}
      URETIM_ONIZLEME_URL: ${URETIM_ONIZLEME_URL:-https://glix.dgmcraft.online/onizleme.html}
      # Canlıya kap adıyla gidilir: site test2'nin ağına da katıldığı için hizmet adı "glix" iki ağda birden geçer.
      URETIM_OYUN_URL: ${URETIM_OYUN_URL:-http://glix-glix-1:3900}
      # Oyun alanı (test2; sözleşme bölüm 13): teslimler buraya kendiliğinden yüklenir. Anahtar test2'nin kendi
      # GLIX_URETIM_TOKEN'ıdır (/srv/glix/ortam/gizli/.env.test2), .env'e URETIM_TEST2_TOKEN adıyla eklenir.
      # Boşsa test2 bağlantısı kapalı (teslimler yalnız sitede durur).
      URETIM_TEST2_URL: ${URETIM_TEST2_URL:-http://glix-test2-glix-1:3900}
      URETIM_TEST2_TOKEN: ${URETIM_TEST2_TOKEN:-}
      URETIM_TEST2_PUBLIC_URL: ${URETIM_TEST2_PUBLIC_URL:-https://test2.glix.dgmcraft.online}
      # Oyunla aynı anahtar (bölüm 3 uçları). Boşsa tek tık aktarım ve canlı havuz kapalı.
      GLIX_URETIM_TOKEN: ${GLIX_URETIM_TOKEN:-}
      URETIM_SAHIP_EPOSTA: ${URETIM_SAHIP_EPOSTA:-}
      GLIX_RESEND_API_KEY: ${GLIX_RESEND_API_KEY:-}
      GLIX_MAIL_FROM: ${GLIX_MAIL_FROM:-}
      # İstek → iş dönüştürücü: oyunun mevcut model anahtarı aynı .env'den okunur, hiçbir dosyaya kopyalanmaz.
      URETIM_AI_KEY: ${GLIX_AI_KEY:-}
      URETIM_AI_GUNLUK: ${URETIM_AI_GUNLUK:-200}
      URETIM_SSH_SUNUCU: ${URETIM_SSH_SUNUCU:-dgmcraft.online}
      # Site bildirimleri (boşsa kapalı). Oyununkinden ayrı anahtar: node scripts/vapid-keys.mjs
      URETIM_VAPID_PUBLIC: ${URETIM_VAPID_PUBLIC:-}
      URETIM_VAPID_PRIVATE: ${URETIM_VAPID_PRIVATE:-}
      URETIM_VAPID_SUBJECT: ${URETIM_VAPID_SUBJECT:-}
      URETIM_KOTA_GB: ${URETIM_KOTA_GB:-20}
      # SSH parolası ve MCP anahtarlarının şifreli kaydı (bölüm 9). Boşsa parola ve istemde anahtar doldurma kapalı.
      URETIM_GIZLI_ANAHTAR: ${URETIM_GIZLI_ANAHTAR:-}
      URETIM_SSH_GUNLUK: /ssh-gunluk/girisler.log
    volumes:
      - /srv/glix/uretim/veri:/veri
      - /srv/glix/uretim/depo:/depo
      - /srv/glix/uretim/aktarim:/aktarim
      - /srv/glix/uretim/ssh-yetki:/ssh-yetki
      - /srv/glix/uretim/ssh:/ssh
      - /srv/glix/uretim/ssh-gunluk:/ssh-gunluk:ro
      - /srv/glix/repo.git:/repo.git:ro
      - /srv/glix/yedek/uretim:/yedek
    # Kap uid/gid 3910 (Dockerfile). SSH gelen/okunur klasörlerine yazabilmek için `uretim-site` grubu (kur.sh).
    user: "3910:3910"
    group_add:
      - ${URETIM_SITE_GID:-3910}
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - glix
      - oyun_alani
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  glix:
    external: true
    # Oyun `-p glix` projesiyle çalışır; varsayılan ağı glix_default'tur.
    name: ${GLIX_AG:-glix_default}
  # Oyun alanı (test2) ile ortak ağ: deploy/ortamlar/kur.sh kurar (elle: docker network create glix-oyun-alani).
  oyun_alani:
    external: true
    name: ${GLIX_OYUN_ALANI_AG:-glix-oyun-alani}
