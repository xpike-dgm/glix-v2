# /etc/fail2ban/filter.d/uretim-sshd.conf — yalnız uretim-* kullanıcılarının başarısız SSH denemeleri.
[Definition]
failregex = ^.*sshd.*: Failed (?:password|publickey) for (?:invalid user )?uretim-[a-z-]+ from <HOST> port \d+.*$
            ^.*sshd.*: Invalid user uretim-[a-z-]+ from <HOST>.*$
ignoreregex =
