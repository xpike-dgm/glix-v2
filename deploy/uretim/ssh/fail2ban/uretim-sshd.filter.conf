# /etc/fail2ban/filter.d/uretim-sshd.conf — yalnız uretim-* kullanıcılarının başarısız SSH denemeleri.
# fail2ban'ın kendi sshd süzgeci gibi: önek `prefregex` ile sabitlenir (makine, sshd[pid]), kullanıcı adı yalnız
# `uretim-[a-z-]+` (boşluk içeremez; saldırgan kullanıcı adına " from <IP>" yazıp başkasının IP'sini yasaklatamaz),
# kalıp satır sonuna bağlıdır.
[INCLUDES]
before = common.conf

[DEFAULT]
_daemon = sshd(?:-session)?

[Definition]
prefregex = ^<F-MLFID>%(__prefix_line)s</F-MLFID><F-CONTENT>.+</F-CONTENT>$
failregex = ^Failed (?:password|publickey) for (?:invalid user )?<F-USER>uretim-[a-z-]{1,40}</F-USER> from <HOST> port \d{1,5} ssh2$
            ^Invalid user <F-USER>uretim-[a-z-]{1,40}</F-USER> from <HOST> port \d{1,5}$
ignoreregex =
