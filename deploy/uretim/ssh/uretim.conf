# /etc/ssh/sshd_config.d/uretim.conf — Üretim Merkezi SSH kanalı (UM-G3, sözleşme bölüm 7).
# Yalnız `uretim-alanlari` grubundaki kullanıcılara uygulanır; sahibin ve yöneticinin bugünkü erişimine dokunmaz.
# Alan başına ChrootDirectory satırları kur.sh tarafından uretim-chroot.conf dosyasına üretilir (aşağıdaki Include).
Match Group uretim-alanlari
	AuthorizedKeysFile /etc/ssh/uretim/%u.authorized_keys
	# Sözleşme bölüm 9: parola yalnız bu blokta açık; sunucunun genel ayarı değişmez. Anahtarla giriş de açık.
	PasswordAuthentication yes
	KbdInteractiveAuthentication no
	MaxAuthTries 3
	PubkeyAuthentication yes
	ForceCommand /bin/uretim
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	AllowAgentForwarding no
	PermitTunnel no
	PermitTTY no
	PermitUserRC no
	GatewayPorts no
Match all
Include /etc/ssh/sshd_config.d/uretim-chroot.conf.inc
